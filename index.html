<style>
:root{--bg:#fff4d6;--surface:#fff;--ink:#2b2350;--muted:#6b6490;--line:#e9dfb8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241c46;--surface:#322868;--ink:#fff7e6;--muted:#c3bbe8;--line:#4a3f86}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{position:relative;margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 Fredoka,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:10px 14px 56px}
.hd{max-width:640px;margin:0 auto;padding:14px 14px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.hd b{font-size:34px;line-height:1.1}
.cof{flex:none;background:#ffd23f;color:#2b2350;font-weight:700;font-size:16px;text-decoration:none;padding:8px 14px;border:3px solid #2b2350;border-radius:16px;box-shadow:0 4px 0 #2b2350}.cof:active{transform:translateY(2px);box-shadow:0 2px 0 #2b2350}.cof:focus-visible{outline:4px solid #1f7ae0;outline-offset:3px}
h1{font-size:40px;line-height:1.1;margin:6px 0 2px;font-weight:700}
h2{font-size:22px;margin:26px 0 10px;font-weight:700}
h2 small{font-size:15px;font-weight:600;background:var(--ink);color:var(--bg);border-radius:20px;padding:2px 10px;margin-left:6px;vertical-align:middle}
p{margin:0 0 10px;color:var(--muted)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:3px solid var(--ink);background:var(--surface);border-radius:16px;padding:10px 16px;font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.card:focus-visible{outline:4px solid #1f7ae0;outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tilewrap{position:relative}
.tile{width:100%;min-height:150px;background:var(--c);color:#fff;border-color:rgba(0,0,0,.28);box-shadow:0 6px 0 rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:12px 8px 14px;border-width:0;border-radius:22px}
.tile:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.tile:disabled{opacity:.55}
.tile .e{font-size:48px;line-height:1.1}
.tile b{font-size:19px;line-height:1.15;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.dots{display:flex;gap:4px;margin-top:6px;min-height:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
.edit{position:absolute;top:6px;right:6px;padding:2px 9px;font-size:14px;border-width:2px;border-radius:12px;background:rgba(255,255,255,.9);color:#2b2350}
.foot{max-width:640px;margin:0 auto;padding:8px 14px 40px;text-align:center}.foot p{margin:0 0 10px}.foot a{display:inline-block;margin:4px;padding:10px 16px;border:3px solid var(--ink);border-radius:16px;background:var(--surface);color:var(--ink);font-weight:600;text-decoration:none}
.kp{position:fixed;left:0;right:0;bottom:0;z-index:15;max-width:440px;margin:0 auto;background:var(--surface);border:4px solid var(--ink);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.25)}.kd{display:flex;justify-content:space-between;align-items:center;font:700 28px Georgia,serif;margin-bottom:8px}.kd button{padding:2px 12px;border-width:2px}.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kg button{font-size:26px;padding:12px 0;border-radius:14px;border-width:3px}.kg .kop{background:var(--bg)}.kg .kgo{grid-column:span 2;background:var(--ink);color:var(--bg);font-size:22px}.abox{font:700 34px Georgia,serif;text-align:center;border:3px solid var(--ink);border-radius:18px;padding:10px;background:var(--surface);cursor:pointer;margin:8px 0}body.kpopen main{padding-bottom:360px}
.eq{font:700 44px/1.2 Georgia,serif;text-align:center;margin:20px 0 6px;overflow-wrap:anywhere}.fb{border-radius:16px;padding:12px;font-weight:600;margin:10px 0}.fb.ok{background:#2e9d5b;color:#fff}.fb.no{background:#d64545;color:#fff}.hints p{margin:6px 0;color:var(--ink)}.row2{display:flex;gap:10px;margin-top:10px}#sa{font-size:24px;text-align:center}.big{width:100%;padding:14px;font-size:20px}
.card.sm{height:190px;margin:8px 0}.card.sm .face{font-size:24px}.card.sm .big{font-size:56px}
.opts{display:grid;gap:10px;margin-top:12px}.opt{font-size:20px;padding:14px;border-radius:18px;text-align:left;border-width:3px;line-height:1.25;overflow-wrap:anywhere}.opt:disabled{opacity:1;cursor:default;color:var(--ink)}.opt.ok{background:#2e9d5b;border-color:#1d6b3b;color:#fff}.opt.no{background:#d64545;border-color:#962a2a;color:#fff}
.modal{position:fixed;inset:0;background:rgba(20,10,50,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}.sheet{background:var(--surface);border:4px solid var(--ink);border-radius:24px;padding:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto}.sheet h2{margin:0 0 8px}.ans{background:var(--c);color:#fff;border-radius:16px;padding:12px;font-size:22px;font-weight:600;margin:8px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.seg button{padding:6px 14px;border-width:2px;border-radius:20px;font-size:16px}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}.tile small{font-size:13px;color:#fff;opacity:.95;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card{perspective:1000px;height:300px;margin:14px 0;cursor:pointer;border-radius:28px}
.inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:28px;background:var(--surface);border:6px solid var(--c);box-shadow:0 8px 0 var(--c);font-size:30px;font-weight:600;line-height:1.25;overflow:auto}
.face .big{font-size:72px;line-height:1.1;overflow-wrap:anywhere}
.face small{font-size:15px;color:var(--muted);font-weight:400;margin-top:12px}
.back{transform:rotateY(180deg);background:var(--c);color:#fff}
.back small{color:#fff;opacity:.9}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
.say{position:absolute;top:10px;right:10px;font-size:22px;padding:4px 10px;border-radius:14px;border-width:2px;background:var(--surface)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.rate button{display:flex;flex-direction:column;align-items:center;font-size:17px;padding:10px 4px;border-radius:20px}
.rate .e{font-size:38px;line-height:1.1}
.rate button:disabled{opacity:.35}
.prog{height:14px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:8px}
form{display:grid;gap:8px;background:var(--surface);border:3px solid var(--ink);border-radius:20px;padding:14px;margin:16px 0}
input,textarea{width:100%;padding:10px;border:3px solid var(--line);border-radius:12px;background:var(--bg)}
textarea{min-height:60px;resize:vertical}
label{font-weight:600}
.primary{background:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--line)}
.row div{flex:1;min-width:0;overflow-wrap:anywhere}
.row .a{color:var(--muted);font-size:16px}
.tag{font-size:14px;color:#d64545;font-weight:600}
.done{text-align:center;padding:20px 4px}
.done .e{font-size:84px}
.stat{display:flex;gap:10px;margin:14px 0}
.stat div{flex:1;background:var(--surface);border:3px solid var(--ink);border-radius:18px;padding:10px;font-size:15px}
.stat b{display:block;font-size:30px}
body.fit{overflow:hidden}
.fit .foot{display:none}
.fit .hd{padding-top:8px}.fit .hd b{font-size:26px}.fit .cof{padding:5px 10px;font-size:14px}

.fit .top{margin-bottom:4px}.fit .prog{height:10px}
.fit .card,.fit .card.sm{height:auto;flex:1 1 0;min-height:100px;margin:8px 0;position:relative}
.fit .inner{position:absolute;inset:0;height:auto}
.fit .face{padding:10px;font-size:clamp(17px,3.2vh,28px);border-width:5px;box-shadow:0 5px 0 var(--c)}
.fit .face .big{font-size:clamp(36px,9vh,72px)}
.fit .face small{font-size:13px;margin-top:6px}
.fit [data-say]{padding:3px 12px;font-size:15px;border-width:2px}
.fit .opts{gap:6px;margin-top:8px}.opts.two{grid-template-columns:1fr 1fr}
.fit .opt{padding:8px 10px;font-size:clamp(15px,2.6vh,19px);border-width:2px;border-radius:14px}
.fit .rate{margin-top:8px;gap:8px}.fit .rate button{padding:6px 4px;font-size:15px}.fit .rate .e{font-size:30px}
.opts .opt.pic{font-size:clamp(40px,9vh,70px);text-align:center;line-height:1.1;padding:6px 4px}
h2.acc{margin:10px 0 0}.accb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--surface);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;font-size:20px;font-weight:700;line-height:1.2}.accb>span:first-child{flex:1}.cnt{font-size:14px;font-weight:600;color:var(--muted)}.chev{font-size:22px}.accbody{margin:10px 0 4px}.accbody[hidden]{display:none}
.lesbtn{width:100%;margin:8px 0 0;border-width:2px;border-radius:14px;font-size:16px;text-align:left}.les{color:var(--ink);font-size:17px;line-height:1.5;white-space:pre-line;margin:0 0 10px}
.mixbtn{width:100%;margin:0 0 12px;padding:14px;font-size:19px;background:var(--ink);color:var(--bg);border-radius:18px;border-width:0;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.prof{background:var(--surface);border:3px solid var(--ink);border-radius:18px;padding:12px;margin:8px 0 12px}.prof .prog i{background:#f0a500}.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.bdg{display:flex;gap:8px;align-items:center;border:2px dashed var(--line);border-radius:14px;padding:8px;opacity:.5}.bdg.on{opacity:1;border:2px solid var(--ink);background:var(--surface)}.bdg i{font-size:28px;font-style:normal}.bdg b{font-size:14px}.bdg small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#f0a500;color:#2b2350;font-weight:700;padding:10px 16px;border-radius:16px;border:3px solid #2b2350;z-index:30;max-width:90%;text-align:center}
#bi{font-size:26px;text-align:center;letter-spacing:1px}
button{touch-action:manipulation}body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}html{-webkit-text-size-adjust:100%}
</style>

const H={'Area of a circle':'Multiply π (about 3.14) by the radius times itself. Example: r = 3 gives 3.14 × 9 ≈ 28.3.','Slope formula':'Slope is rise over run: how much y changes divided by how much x changes between two points.','Solve 2x + 6 = 14':'Subtract 6 from both sides to get 2x = 8. Then divide both sides by 2: x = 4.','15% of 80':'Turn 15% into 0.15, then multiply: 0.15 × 80 = 12. Or take 10% (8) plus 5% (4).','Pythagorean theorem':'In a right triangle, the two short sides squared and added equal the long side squared. 3-4-5: 9 + 16 = 25.','Perimeter of a rectangle':'Perimeter is the distance around. Add all four sides: two lengths and two widths.','Solve 3x − 7 = 11':'Add 7 to both sides: 3x = 18. Divide by 3: x = 6.','Solve x² − 5x + 6 = 0':'Find two numbers that multiply to 6 and add to −5: −2 and −3. So (x − 2)(x − 3) = 0, giving x = 2 or 3.','Volume of a cylinder':'The circle on the bottom has area π × r². Multiply by the height to stack it up.','Distance formula':'It is the Pythagorean theorem in disguise: the x and y differences are the two short sides.','Simple interest':'Principal times rate times years. $100 at 5% for 2 years: 100 × 0.05 × 2 = $10.','Quadratic formula':'Use it when a quadratic won’t factor. Put in a, b, and c, then solve once with + and once with −.','Mean':'Add up every number, then divide by how many numbers there are. 2, 4, 6 → 12 ÷ 3 = 4.','Median':'Put the numbers in order and pick the middle one. With two middles, average them.','Order of operations':'Parentheses first, then exponents, then multiply/divide left to right, then add/subtract left to right.','Newton’s 2nd law':'Force equals mass times acceleration. A heavier object needs more force to speed up by the same amount.','Meiosis':'Meiosis makes egg and sperm cells with half the chromosomes. Mitosis makes identical copies.','Mitosis':'Mitosis copies a cell into two identical cells. It’s how you grow and heal.','Natural selection':'Animals with helpful traits survive and have more babies, so those traits spread over many generations.','Ionic bond':'One atom gives away electrons and another takes them. The opposite charges stick together, like salt.','pH below 7 is…':'The pH scale runs 0–14. Below 7 is acidic (lemon juice), 7 is neutral (water), above 7 is basic (soap).','Kinetic energy':'Kinetic means moving. A rolling ball has kinetic energy; a ball at the top of a hill has potential energy.','Producers vs. consumers':'Producers (plants) make food from sunlight. Consumers (animals) get energy by eating.','Speed formula':'Speed = distance ÷ time. 120 miles in 2 hours: 120 ÷ 2 = 60 mph.','13th Amendment':'Ratified in 1865, right after the Civil War, it ended slavery in the United States.','Marbury v. Madison':'This 1803 case let the Supreme Court decide whether a law breaks the Constitution. That power is called judicial review.','Inflation':'When prices rise across the economy, each dollar buys less than before.','Louisiana Purchase':'In 1803 the U.S. bought land from France for about $15 million, roughly doubling the country.','Electoral College':'Each state gets electors based on its population. They cast the votes that officially choose the president.','Checks and balances':'Each branch can limit the others: Congress makes laws, the president can veto them, and courts can strike them down.','Primary vs. secondary source':'A diary or photo from the time is primary. A textbook written later about that time is secondary.','Comma splice':'Fix it with a period, a semicolon, or a comma plus and/but. “I ran, I was late” → “I ran; I was late.”','Run-on sentence':'Two complete sentences need a period, a semicolon, or a joining word between them.','Passive voice':'Passive hides who did it. Active is stronger: “Maria threw the ball.”','Tone':'Tone is the writer’s attitude (angry, hopeful, joking). Look at word choices for clues.','Its vs. it’s':'Try replacing it with “it is.” If that works, use it’s. If not, use its.','There, their, they’re':'They’re = they are. Their shows ownership. There points to a place.','Thesis statement':'One sentence, usually in the first paragraph, that tells the reader your main argument.','Metaphor':'A metaphor says one thing IS another (“time is money”). A simile uses like or as.','Double it: run → running':'After a short vowel plus one consonant, double the consonant before -ing: run → running, sit → sitting.','Drop the e: make → making':'If a word ends in a silent e, drop it before adding -ing: make → making, hope → hoping.','Silent e: hop → hope':'The silent e at the end tells the vowel to say its name: hop → hope.','Bias':'Watch for loaded words and missing sides. Ask who benefits if you believe this.','Tone vs. mood':'Tone comes from the writer. Mood is what you feel while reading.','Main idea':'Ask: if I could say only one sentence about the whole passage, what would it be?','Context clues':'Read the sentences around the word. Look for examples, opposites, or a restating of the meaning.','2/5 as a decimal':'Divide 2 by 5 to get 0.4.','0.75 as a fraction':'0.75 is 75 hundredths: 75/100. Divide top and bottom by 25 to get 3/4.','5/8 + 1/8':'The bottom numbers match, so add the tops: 6/8. Divide both by 2 to get 3/4.','10% of 90':'10% means divide by 10. 90 ÷ 10 = 9.','1/4 + 1/4':'The bottoms match, so add the tops: 2/4. That simplifies to 1/2.','Hardest natural material':'Diamond is the hardest because its carbon atoms are packed tightly together.',
'Closest planet to the Sun':'Mercury is first in the line of planets. Remember “My Very Educated Mother Just Served Us Nachos.” The first word, My, is Mercury.','The Red Planet':'Mars looks red because its dirt has rusty iron in it.','Biggest planet':'Jupiter is so big that over 1,000 Earths could fit inside it.','Planet with big rings':'Saturn’s rings are chunks of ice and rock. Other planets have rings too, but Saturn’s are the biggest and brightest.','What orbits Earth?':'To orbit means to travel in a circle around something. The Moon circles Earth about once a month.','Our nearest star':'The Sun is a star. It looks huge and bright because it is so much closer than the other stars.','What is the Moon made of?':'The Moon is made of rock and dust, not cheese!','Hottest planet':'Venus is hotter than Mercury because its thick clouds trap heat like a blanket.','Galaxy we live in':'A galaxy is a huge group of stars. Ours is called the Milky Way.','What is a comet?':'A comet is a ball of ice and dust. Near the Sun it heats up and grows a glowing tail.',
'1/2 as a decimal':'Divide the top by the bottom: 1 ÷ 2 = 0.5.','3/4 as a percent':'3 ÷ 4 = 0.75. Move the decimal two places to get 75%.','0.25 as a fraction':'0.25 is 25 hundredths: 25/100. Divide both by 25 to get 1/4.','2/3 + 1/3':'The bottoms match, so add the tops: 3/3, which is one whole.','1/5 as a percent':'1 ÷ 5 = 0.2. Move the decimal two places to get 20%.','Simplify 6/8':'Find a number that goes into both. 2 goes into 6 and 8, so 6/8 = 3/4.','Half of 10':'Half means split into 2 equal groups. 10 ÷ 2 = 5.',
'Delaware':'The capital is Dover. Delaware was the very first state to join the U.S.','Texas':'The capital is Austin, named after Stephen F. Austin, who helped settle Texas.','California':'The capital is Sacramento, not Los Angeles or San Francisco.','Florida':'The capital is Tallahassee, not Miami. It is up in the northern part of the state.','New York':'The capital is Albany, not New York City.','Pennsylvania':'The capital is Harrisburg, not Philadelphia.','Georgia':'The capital is Atlanta, which is also the biggest city in Georgia.','Massachusetts':'The capital is Boston, one of the oldest cities in the country.','Arizona':'The capital is Phoenix, named after the legendary bird that rises from its ashes.','Ohio':'The capital is Columbus, named after Christopher Columbus.','Illinois':'The capital is Springfield, not Chicago. Abraham Lincoln lived there.','Washington':'The capital is Olympia, not Seattle.',
'What do plants use for photosynthesis?':'Plants take in sunlight, carbon dioxide from the air, and water from the soil, and turn them into food.','Powerhouse of the cell':'Mitochondria turn food into energy the cell can use, like a tiny power plant.','Force that pulls things toward Earth':'Gravity is why things fall when you drop them and why you stay on the ground.','3 states of matter':'Solid keeps its shape (ice), liquid flows (water), and gas spreads out (steam).','Liquid turning into gas':'When water heats up it turns into invisible vapor and rises. That is evaporation.','What do we breathe in?':'Air has oxygen in it, and our bodies need oxygen to make energy.','Which planet do we live on?':'We live on Earth, the third planet from the Sun.','Part of a plant that takes in water':'Roots grow down into the soil and soak up water for the plant.','Animals with backbones':'Vertebrates have a spine. Dogs, birds, fish, and people are all vertebrates.',
'Character':'Characters are the people or animals in a story. Ask: who is it about?','Setting':'Setting is where and when the story happens. Look for clues like place, weather, or time.','Plot':'Plot is what happens: the beginning, the problem in the middle, and how it ends.','Theme':'Theme is the lesson of the story. Ask: what did the character learn?','Beginning, middle, end':'Beginning: who and where. Middle: the problem. End: how it gets solved.','Predict':'Use clues from the story and what you already know to guess what comes next.','Sequence':'Sequence means order. Look for words like first, next, then, and last.','Problem and solution':'Ask: what went wrong? Then ask: what did the character do to fix it?','Point of view':'If the story says “I,” a character is telling it. If it says “he” or “she,” someone outside the story is telling it.',
'Short vowel sounds':'Short vowels are quick sounds: a in cat, e in bed, i in sit, o in hot, u in cup.','“ch” sounds like':'The letters c and h together make one sound, like at the start of “chair” and “cheese.”','Long a spellings':'The long a says its own name. It can be spelled a_e (cake), ai (rain), or ay (day).','“c” before e, i, y sounds like':'Before e, i, or y, the letter c goes soft and says s: city, cent, cycle. Otherwise it says k, like cat.','Spelling trick: separate':'People often write “seperate.” Remember there’s a rat in sepARATe.','Silent letters: knife':'Some letters stay quiet. In knife the k is silent, so it sounds like “nife.” Others: knee, know.','“ough” in though':'The ough pattern sounds different in different words: though (oh), through (oo), tough (uff). Learn each word.','Spelling rule: receive':'Use i before e, except after c: receive, ceiling, but believe, friend.','cap → cape':'Adding a silent e changes the vowel from short to long: cap → cape, kit → kite.','“-tion” sounds like':'The ending -tion sounds like “shun”: nation, action, station.','“ph” sounds like':'The letters p and h together say f: phone, photo, graph.',
'Title':'The title is the name of the book or passage. It often hints at the topic.','Topic vs. main idea':'Topic is the subject in a word or two (dogs). Main idea says something about it (dogs help people).','Cause and effect':'The cause is why it happened. The effect is what happened next. Look for because, so, and as a result.','Supporting details':'Details are the facts, examples, or reasons that prove the main idea.','Compare and contrast':'Compare means how things are alike. Contrast means how they are different.','Skim vs. scan':'Skim: read quickly for the big idea. Scan: move your eyes fast, hunting for one word or number.','Noun':'Nouns name things: girl, school, dog, freedom. Ask: can I put “the” in front of it?','Verb':'Verbs show action or being: run, think, is. Ask: what is happening?','Your vs. you’re':'Try replacing it with “you are.” If it fits, use you’re. If not, use your.',
'Bill of Rights':'Ten amendments added to the Constitution in 1791 to protect people’s freedoms.','3 branches of government':'Legislative (Congress) makes laws, executive (the president) carries them out, and judicial (the courts) explains them.','Principal author of the Declaration of Independence':'Thomas Jefferson wrote most of it in 1776. A committee reviewed it and Congress approved it.','Civil War years':'The war started in 1861 and ended in 1865.','Supply and demand':'When many people want something scarce, the price goes up. When it is plentiful, the price drops.','Number of states':'There are 50 states.','Capital of the U.S.':'Washington, D.C. is the capital. D.C. stands for District of Columbia.','First U.S. president':'George Washington led the country from 1789 to 1797.','1st Amendment protects':'Remember the five freedoms: speech, religion, press, assembly, and petition.',
'Topic sentence':'The topic sentence usually opens a paragraph and tells the reader what the paragraph is about.','“The dogs ___ loud.” (is/are)':'The subject “dogs” is plural, so the verb must be plural too: are.','Claim vs. evidence':'A claim is what you argue. Evidence is the facts or examples that prove it.',
'DNA stands for':'DNA holds the instructions for how living things grow. It is shaped like a twisted ladder.','Basic unit of life':'Every living thing is made of cells. Some have just one; people have trillions.','Plants make food by':'Plants use sunlight to turn water and carbon dioxide into sugar and oxygen.','Water boils at':'At sea level, water boils at 100°C, which is 212°F.','Chemical symbol for sodium':'Sodium’s symbol is Na, from its Latin name natrium.','Atoms in H₂O':'The small 2 means two hydrogen atoms. With one oxygen, that makes a water molecule.','25% as a fraction':'Percent means out of 100. 25/100 simplifies to 1/4.','Area of a triangle':'A triangle is half of a rectangle with the same base and height: ½ × b × h.','Circumference of a circle':'Circumference is the distance around a circle: 2 × π × radius, or π × diameter.','Solve 2(x + 3) = 14':'Divide both sides by 2 to get x + 3 = 7. Then subtract 3: x = 4.','Solve x/4 = 7':'x is being divided by 4. Multiply both sides by 4: x = 28.','Solve 5x = 45':'Divide both sides by 5: x = 9.','Probability formula':'Probability = what you want ÷ everything that could happen. One red marble among 5 marbles: 1/5.','Mode':'Mode sounds like “most.” Count which value shows up the most.','Range':'Subtract the smallest value from the largest.','Slope of a horizontal line':'A flat line never rises, so rise = 0 and the slope is 0.','Negative × negative':'Two negatives cancel out: −3 × −4 = 12.','Negative × positive':'One negative makes the answer negative: −3 × 4 = −12.','A ratio of 3:2 means':'A ratio compares amounts. 3:2 means for every 3 of the first, there are 2 of the second.','Affect vs. effect':'Affect = Action (verb). Effect = End result (noun).','Semicolon use':'A semicolon can replace a period between two closely related complete sentences.','Emancipation Proclamation':'Lincoln issued it on January 1, 1863. It declared enslaved people in Confederate states free.','19th Amendment':'Ratified in 1920, it protects women’s right to vote.','Judicial review':'Courts can strike down laws that conflict with the Constitution (Marbury v. Madison).','GDP':'GDP (gross domestic product) measures everything a country produces in a year.','Atomic number':'The number of protons identifies the element. Hydrogen has 1, carbon has 6.','What does a catalyst do?':'A catalyst lowers the energy needed so a reaction goes faster, and it is not used up.','Dominant allele':'You get one allele from each parent. If one is dominant, its trait shows.','Climax':'The climax is the turning point and the most tense moment of the story.','Syllable':'Clap as you say a word. Each clap is a syllable.','Digraph':'Two letters, one sound: sh in ship, th in thin.','Convert 3/4 to a percent':'Divide 3 by 4 to get 0.75, then move the decimal two places: 75%.','Solve x + 9 = 15':'Subtract 9 from both sides: x = 15 − 9 = 6.','Convert 5 feet to inches':'There are 12 inches in a foot, so 5 × 12 = 60.','5⁰ equals':'Any nonzero number raised to the power 0 equals 1.','Simplify 3(x + 4)':'Distribute the 3 to both terms: 3 · x + 3 · 4 = 3x + 12.','A 20% discount on $50 saves':'20% of 50 = 0.20 × 50 = $10.','Area of a trapezoid':'Average the two parallel sides, then multiply by the height.','Volume of a sphere':'The radius is cubed because volume is three-dimensional. Surface area uses r² instead.','Percent change formula':'Find how much it changed, divide by the starting value, then multiply by 100.','Solve 4x − 5 = 2x + 9':'Subtract 2x from both sides: 2x − 5 = 9. Add 5: 2x = 14. Divide by 2: x = 7.','Factor x² + 7x + 12':'Find two numbers that multiply to 12 and add to 7: that’s 3 and 4.','Slope through (0, 1) and (2, 5)':'Rise is 5 − 1 = 4 and run is 2 − 0 = 2. Slope = 4 ÷ 2 = 2.','Boiling point of water in °F':'Water boils at 100°C, which equals 212°F.','Which blood cells carry oxygen?':'Red blood cells use hemoglobin to carry oxygen around the body.','Chemical formula for table salt':'One sodium (Na) atom bonds with one chlorine (Cl) atom.','Fossil fuels are':'They formed from ancient plants and animals over millions of years, and burning them releases carbon dioxide.','Which organelle makes proteins?':'Ribosomes read instructions and build proteins. Mitochondria make energy.','Photosynthesis happens in':'Chloroplasts hold the green chlorophyll that captures sunlight.','Newton’s 3rd law':'When you push on a wall, the wall pushes back on you with equal force.','The sun’s energy comes from':'In the sun, hydrogen atoms fuse into helium and release huge amounts of energy.','Law of conservation of mass':'Atoms are rearranged in a reaction, not lost, so the total mass stays the same.','Genotype vs. phenotype':'Genotype is the gene code (Bb). Phenotype is what you can see (brown eyes).','Ohm’s law':'Voltage equals current times resistance. If resistance goes up, current goes down.','Number of U.S. senators':'Each of the 50 states has 2 senators.','Length of a senator’s term':'Senators serve 6 years. House members serve 2, and presidents serve 4.','Length of a House member’s term':'House members serve 2 years, so all of them are up for election every two years.','Brown v. Board of Education (1954)':'The Supreme Court ruled that separate schools for Black and white students were unconstitutional.','Monopoly':'With no competition, one company can control prices and quality.','World War II ended in':'Germany surrendered in May 1945 and Japan in September 1945.','The Louisiana Purchase was bought from':'In 1803 the U.S. bought the Louisiana Territory from France.','Federalism':'The Constitution divides power between the national government and the states.','“Father of the Constitution”':'James Madison wrote much of the Constitution and the Bill of Rights.','The Great Migration':'From about 1916 to 1970, millions of Black Americans moved north and west for jobs and to escape Jim Crow.','Opportunity cost':'If you spend an evening studying instead of working, the pay you skip is the opportunity cost.','When do you capitalize a noun?':'Capitalize proper nouns, like Mary, Texas, or Friday. Common nouns like girl or city stay lowercase.','Fragment':'A fragment is missing a subject or a verb, like “Walking to the store.”','A conclusion should':'End by restating your main point in new words. Don’t add brand-new arguments.','Active voice':'Active: “The dog chased the cat.” Passive: “The cat was chased by the dog.”','Quotation marks are used for':'Use them around spoken words, and around titles of poems, songs, and articles.','The dog’s bone: where does the apostrophe go?':'One dog owns the bone, so the apostrophe goes before the s. For several dogs it goes after: dogs’.','Hyperbole':'“I’m so hungry I could eat a horse” is hyperbole. Nobody means it literally.','Personification':'“The wind whispered” gives a human action to the wind.','Irony':'A fire station burning down is ironic: the opposite of what you would expect.','Who vs. whom':'Try he/him. If “he” fits, use who. If “him” fits, use whom.','Average of 70, 80, and 90':'Add them to get 240, then divide by 3: 80.','Rectangle 8 by 5: perimeter?':'Perimeter is all four sides: 2 × 8 + 2 × 5 = 26.','Rectangle 8 by 5: area?':'Area is length times width: 8 × 5 = 40.','A car goes 180 miles in 3 hours. Speed?':'Speed = distance ÷ time. 180 ÷ 3 = 60 miles per hour.','A shirt costs $40 and is 25% off. Sale price?':'25% of 40 is 10. Then 40 − 10 = 30.','Tax of 8% on $50?':'8% of 50 = 0.08 × 50 = $4.','Triangle angles: 50° and 60°. Third angle?':'The angles in a triangle add to 180°. 180 − 50 − 60 = 70.','Solve 2x/3 = 8':'Multiply both sides by 3 to get 2x = 24. Divide by 2: x = 12.','Simple interest: $200 at 5% for 3 years':'Interest = P × r × t = 200 × 0.05 × 3 = $30.','Compound word':'Two words become one new word: sun + shine = sunshine.','Contraction':'An apostrophe stands in for missing letters: do not → don’t.','Add -ing to “bake”':'Drop the silent e before adding -ing: bake → baking.','Long e spellings':'The long e says its own name. It shows up in these, tree, and read.','Plural of “city”':'After a consonant plus y, change the y to i and add es: city → cities.','Plural of “leaf”':'Some words ending in f change to ves: leaf → leaves, wolf → wolves.','“ight” as in night':'The gh is silent. The pattern sounds like “ite”: night, light, right.','Hard vs. soft g':'Before e, i, or y, g often goes soft and says j: giant, gym. Otherwise it is hard: go, gap.','“tch” as in catch':'After a short vowel, tch says “ch” and the t is silent: catch, match, watch.','Point of view: “I”':'If the narrator says I or we, it is first person.','Point of view: “he” or “she”':'If the narrator talks about he, she, or they, it is third person.','Fact vs. opinion':'Ask: can this be proved? “Water freezes at 0°C” is a fact. “Winter is the best season” is an opinion.','Inference':'If a character is shivering and wearing a coat, you can infer it is cold, even if the text never says so.','Author’s purpose':'Ask why the author wrote it: to teach you (inform), change your mind (persuade), or amuse you (entertain).','Chronological order':'Look for time clues like first, then, later, and finally.','Evidence':'Evidence backs up a claim. Strong evidence is specific, such as a fact, statistic, or quote.','Implied main idea':'When no sentence states the main idea, add up the details and ask what point they all support.','Connotation':'“Slim” and “skinny” both mean thin, but skinny feels less positive. That difference is connotation.','summarize':'A summary hits only the main points, in your own words, and leaves out small details.','mandatory':'Mandatory means you have no choice. Voting is optional; paying taxes is mandatory.','verify':'To verify is to check. You verify a fact by finding a reliable source.','reliable':'A reliable friend or source is one you can count on.','sufficient':'Sufficient means enough. Insufficient means not enough.','hazard':'A hazard is something that could cause harm, like a wet floor.','elaborate':'To elaborate is to add detail. “Can you elaborate?” means “tell me more.”','evident':'If something is evident, it is plain to see. The evidence is evident.','negotiate':'Both sides talk and compromise until they agree.','post-':'Post- means after: postgame is after the game, postpone is to move it to later.','-tion':'Adding -tion turns a verb into a noun: act → action, create → creation.','micro-':'Micro- means tiny: a microscope shows tiny things.','auto-':'Auto- means self: an automatic door opens by itself.','ex-':'Ex- can mean former (ex-president) or out (exit, export).','hyper-':'Hyper- means over or too much: hyperactive means overly active.','Alabama':'The capital is Montgomery, not Birmingham. Montgomery was a key city in the civil rights movement.','Arkansas':'Little Rock sits in the middle of the state on the Arkansas River.','Connecticut':'Hartford is in central Connecticut. It is not New Haven.','Idaho':'Boise is both the capital and the biggest city in Idaho.','Indiana':'Indianapolis starts with “Indian” like Indiana. Use that as a clue.','Iowa':'Des Moines is in the middle of Iowa and is its biggest city.','Kansas':'The capital is Topeka, not Wichita or Kansas City.','Kentucky':'The capital is Frankfort, not Louisville or Lexington.','Louisiana':'Baton Rouge means “red stick” in French. The capital is not New Orleans.','Maine':'The capital is Augusta, not Portland. It sits on the Kennebec River.','Minnesota':'Saint Paul is right next to Minneapolis. Together they are the Twin Cities.','Mississippi':'Jackson is named after Andrew Jackson.','Missouri':'Jefferson City is named after Thomas Jefferson. It is not St. Louis.','Montana':'The capital is Helena. Billings is bigger but is not the capital.','Nebraska':'Lincoln is named after Abraham Lincoln. It is not Omaha.','New Hampshire':'Concord means “harmony.” The capital is not Manchester.','New Mexico':'Santa Fe is the oldest state capital in the United States.','North Carolina':'The capital is Raleigh, not Charlotte.','North Dakota':'The capital is Bismarck, not Fargo.','Oklahoma':'Oklahoma City is both the capital and the largest city.','Rhode Island':'Providence is both the capital and the biggest city.','South Carolina':'Columbia sits in the middle of South Carolina.','South Dakota':'Pierre is said like “peer.” It is not Sioux Falls.','Utah':'Salt Lake City is named after the Great Salt Lake.','Vermont':'Montpelier is the smallest state capital in the country.','West Virginia':'Charleston. Don’t mix it up with Charleston, South Carolina.','Wyoming':'Cheyenne is in the southeast corner of the state.','First president':'George Washington led the country from 1789 to 1797 and set many traditions.','Second president':'John Adams followed Washington. His son John Quincy Adams became the 6th president.','Third president; wrote the Declaration of Independence':'Thomas Jefferson wrote most of the Declaration in 1776 and became president in 1801.','16th president; led during the Civil War':'Abraham Lincoln led the Union through the Civil War and was president from 1861 to 1865.','President on the $5 bill':'Lincoln is on the $5 bill and the penny. Washington is on the $1 bill.','President on the $50 bill':'Ulysses S. Grant led the Union army and later became the 18th president.','Only president elected four times':'Franklin D. Roosevelt won in 1932, 1936, 1940, and 1944. Later, the 22nd Amendment limited presidents to two terms.','First president to live in the White House':'John Adams moved in during 1800, when the building was still unfinished.','President who bought the Louisiana Territory':'Jefferson bought it from France in 1803 and roughly doubled the size of the country.','First president to resign':'Richard Nixon resigned in 1974 during the Watergate scandal.','First African American president':'Barack Obama was elected in 2008 and served two terms.','President who led the U.S. during World War I':'Woodrow Wilson was president from 1913 to 1921. The U.S. entered the war in 1917.','The teddy bear is named after which president?':'Theodore “Teddy” Roosevelt refused to shoot a bear cub on a hunting trip. Toy makers named the teddy bear after him.','How many terms can a president serve?':'The 22nd Amendment limits a president to two elected terms.','Where is the White House?':'The White House is at 1600 Pennsylvania Avenue in Washington, D.C.','George Washington’s home':'Mount Vernon is in Virginia, on the Potomac River.','Thomas Jefferson’s home':'Jefferson designed Monticello himself. It is on the back of the nickel.','Lincoln’s famous 1863 speech':'The Gettysburg Address was a short speech at a Civil War battlefield cemetery.','Year the Declaration of Independence was signed':'On July 4, 1776, the colonies declared independence from Great Britain.','Year Columbus sailed to the Americas':'Remember the rhyme: in 1492, Columbus sailed the ocean blue.','Pilgrims landed at Plymouth in':'The Mayflower arrived in 1620 at Plymouth, Massachusetts.','The U.S. Constitution was written in':'Delegates met in Philadelphia in the summer of 1787.','Original number of colonies':'There were 13 British colonies along the Atlantic coast. They became the first 13 states.','First state to ratify the Constitution':'Delaware approved it first, on December 7, 1787. That is why Delaware is called The First State.','The Boston Tea Party was a protest against':'In 1773, colonists dumped tea into Boston Harbor to protest British taxes.','Who was the main enemy of the American Revolution?':'The colonists fought for independence from Great Britain.','Louisiana Purchase year':'In 1803 the U.S. bought land from France that stretched from the Mississippi River to the Rocky Mountains.','The Civil War was fought between':'The Union (North) fought the Confederacy (South) from 1861 to 1865.','The Underground Railroad was':'It was not a real railroad. It was a secret network of people and safe houses.','Harriet Tubman is known for':'Tubman escaped slavery and then guided many others to freedom.','The transcontinental railroad connected':'Finished in 1869, it linked the East and West coasts by rail.','Ellis Island was where':'From 1892 to 1954, millions of immigrants were checked here before entering the U.S.','The Wright brothers':'Orville and Wilbur Wright flew the first airplane at Kitty Hawk, North Carolina, in 1903.','Martin Luther King Jr. is famous for':'Dr. King led peaceful protests for equal rights and gave the “I Have a Dream” speech in 1963.','Rosa Parks refused to':'In 1955 Rosa Parks refused to give up her bus seat, which sparked the Montgomery bus boycott.','The first astronauts landed on the Moon in':'Apollo 11 landed in July 1969, and Neil Armstrong took the first step.','Pearl Harbor was attacked on':'Japan attacked Pearl Harbor, Hawaii. The next day the U.S. joined World War II.','Statue of Liberty was a gift from':'France gave the statue to the U.S. in 1886.','Pythagorean triple':'Whole numbers that fit a² + b² = c². 3² + 4² = 5² and 5² + 12² = 13².','60 mph for 2.5 hours: distance?':'Distance = rate × time = 60 × 2.5 = 150 miles.','Solve 3x + 2 < 14':'Subtract 2: 3x < 12. Divide by 3: x < 4. Only flip the sign when you multiply or divide by a negative.','Solve −2x > 8':'Divide by −2 and flip the sign: x < −4.','4,500 in scientific notation':'Move the decimal 3 places to get 4.5, so 4,500 = 4.5 × 10³.','x³ · x⁴':'Same base, so add the exponents: 3 + 4 = 7.','(x²)³':'Power of a power: multiply the exponents. 2 × 3 = 6.','√50 is between':'7² = 49 and 8² = 64, so √50 is just above 7.','Probability of rolling a 4 on a die':'One favorable outcome out of 6 equally likely outcomes: 1/6.','Area of a circle with radius 5':'π × r² = π × 25 = 25π.','y-intercept of y = −3x + 5':'In y = mx + b, b is where the line crosses the y-axis. Here b = 5.','Parallel lines have':'Parallel lines never meet, so they rise at the same rate.','Perpendicular lines have':'Flip the fraction and change the sign: 2/3 and − h after Reconstruction, kept Black and white Americans separate and unequal.','Civil Rights Act of 1964':'This law banned discrimination in jobs and public places and in programs that get federal money.','The New Deal':'In the 1930s, FDR’s programs created jobs and set up Social Security.','Supply':'When the price rises, producers usually supply more.','Recession':'Typical signs are falling spending and rising unemployment.','Latitude lines run':'Latitude lines are parallel to the equator and measure north or south. Longitude lines run north–south.','Main idea vs. supporting details':'Main idea is the big point. Details are the facts and examples that back it up.','Using context clues':'Read the words around an unfamiliar word. Look for examples, opposites, or restatements.','Theme of a passage':'The theme is a message about life that the whole passage suggests.','“The team ___ ready.” (is/are)':'“Team” is one group, so it takes the singular verb: The team is ready.','Correct: “Between you and ___”':'After a preposition like between, use the object pronoun: between you and me.','Colon use':'A colon often comes after a complete sentence to introduce what follows: You need three things: a pencil, paper, and time.','Comma after an introductory phrase':'Put a comma after an opening phrase: After lunch, we left.','Transition word for contrast':'However, but, and on the other hand signal a change in direction.','Transition word for cause and effect':'Therefore, as a result, and consequently show that one thing caused another.','Parts of an argument essay':'A strong argument states a claim, backs it with evidence, explains the reasoning, and answers the other side.','Counterclaim':'A good writer acknowledges the opposing view and then explains why the claim still holds.','Redundancy example':'A redundant phrase repeats an idea, like “free gift” or “advance planning.” Cut the extra word.'};

const LES={1:{t:'Derivatives & the power rule',p:[`What it means: the derivative tells you how fast a function is changing. On a graph, it is the slope of the curve at one point.`,`Power rule: bring the exponent down in front, then subtract 1 from the exponent.
d/dx [xⁿ] = n·xⁿ⁻¹
Example: d/dx [x⁴] = 4x³`,`Numbers in front just come along for the ride:
d/dx [5x³] = 5 · 3x² = 15x²
d/dx [7x] = 7
d/dx [any plain number] = 0`,`Worked example: f(x) = 4x³ + 2x
f′(x) = 12x² + 2
f′(1) = 12 + 2 = 14`,`“Find f′(k)” means: differentiate FIRST, then plug in k.`,`Critical points are where f′(x) = 0. The slope is flat there (top of a hill or bottom of a valley).
Example: f(x) = x² − 6x + 1
f′(x) = 2x − 6
Set 2x − 6 = 0, so x = 3.`]},
2:{t:'The chain rule',p:[`Use it when one function sits inside another, like (2x + 1)³. The inside is 2x + 1. The outside is “cube it.”`,`Rule: derivative of the outside (leave the inside alone), times the derivative of the inside.`,`Worked example: f(x) = (2x + 1)³
Outside: 3(2x + 1)²
Inside: the derivative of 2x + 1 is 2
f′(x) = 3(2x + 1)² · 2 = 6(2x + 1)²
f′(0) = 6(1)² = 6`,`Steps: 1) spot the inside, 2) differentiate the outside and keep the inside as is, 3) multiply by the inside’s derivative, 4) plug in the number.`,`Most common mistake: forgetting to multiply by the inside’s derivative.`]},
3:{t:'Integrals (area & antiderivatives)',p:[`What it means: a definite integral is the area under a curve between two x-values. An antiderivative is a function whose derivative gives you the original.`,`Reverse power rule: add 1 to the exponent, then divide by the new exponent.
∫ xⁿ dx = xⁿ⁺¹ ÷ (n + 1)
Example: ∫ 3x² dx = x³`,`Definite integral: find the antiderivative F(x), then compute F(top) − F(bottom).`,`Worked example: ∫₀² (3x² + 1) dx
F(x) = x³ + x
F(2) = 8 + 2 = 10
F(0) = 0
Answer: 10 − 0 = 10`,`Common mistake: differentiating instead of integrating. Integrating makes exponents go UP by one.`]},
4:{t:'Limits',p:[`What it means: a limit asks what value f(x) is heading toward as x gets close to a number, even if you can’t plug that number in directly.`,`Step 1: try plugging in. If you get a number, you’re done.`,`Step 2: if you get 0/0, there is a hidden common factor. Factor the top, cancel the factor that matches the bottom, then plug in again.`,`Worked example: lim (x→3) (x² − 9) / (x − 3)
Plugging in gives 0/0.
Factor: x² − 9 = (x − 3)(x + 3)
Cancel (x − 3), leaving x + 3
Plug in 3: the limit is 6.`,`Factoring helpers:
Difference of squares: a² − b² = (a − b)(a + b)
Trinomial: x² + (p + r)x + pr = (x + p)(x + r)`]}};

const bg=s=>{s=s.toLowerCase();const r=new Set();for(let i=0;i<s.length-1;i++)r.add(s.slice(i,i+2));return r};
const jac=(a,b)=>{let i=0;a.forEach(x=>{if(b.has(x))i++});return i/(a.size+b.size-i||1)};

const sim=(x,y)=>jac(bg(x),bg(y))+jac(wd(x),wd(y))+1/(1+Math.abs(x.length-y.length)/8);

if(m=a.match(/^(\d{4})–(\d{4})$/)){const y=+m[1],z=+m[2];return [[y-1,z],[y+1,z],[y,z-1],[y,z+1],[y-1,z-1]].map(p=>p[0]+'–'+p[1])}
